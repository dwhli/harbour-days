<!DOCTYPE html><html lang="en"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111d2a">
<title>Harbour Days</title>

<style>
:root {
  color-scheme: dark;
  --bg: #111d2a;
  --panel: #1b2c3b;
  --cream: #f4f0e6;
  --muted: #a9b9c1;
  --mint: #bcebd8;
  --coral: #ef9588;
  --gold: #f2c698;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--cream);
  font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
}
button { font: inherit; }
button:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 5px;
}
[hidden] { display: none !important; }

.app {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  outline: none;
}
header {
  position: absolute;
  inset: 0 0 auto;
  padding: max(23px, env(safe-area-inset-top)) 27px 55px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
  background: linear-gradient(#111d2ae8, transparent);
  pointer-events: none;
  transition: opacity .8s;
}
h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -.7px;
}
.subtitle {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
}
.sound {
  pointer-events: auto;
  padding: 8px 11px;
  border: 1px solid #ffffff20;
  border-radius: 30px;
  background: #172735aa;
  color: var(--muted);
  cursor: pointer;
  font-size: 11px;
}
.bottom {
  position: absolute;
  inset: auto 0 0;
  padding: 55px 16px max(22px, env(safe-area-inset-bottom));
  background: linear-gradient(transparent, #111d2af5);
  text-align: center;
  pointer-events: none;
}
.objective {
  margin-bottom: 11px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -.2px;
}
.eyebrow {
  margin-bottom: 6px;
  color: var(--mint);
  text-transform: uppercase;
  font-size: 9px;
  letter-spacing: 2px;
}
.action {
  pointer-events: auto;
  min-width: 174px;
  padding: 12px 18px;
  border: 1px solid transparent;
  border-radius: 30px;
  background: var(--mint);
  color: #1d3c34;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: background .2s, opacity .2s, transform .2s;
}
.action:hover:not(:disabled) {
  background: #daf7ea;
  transform: translateY(-1px);
}
.action:disabled {
  background: #233745;
  border-color: #ffffff12;
  color: #9bafb8;
  cursor: default;
}
.action .key {
  margin-left: 10px;
  font-size: 10px;
  opacity: .65;
}
.instructions {
  margin-top: 12px;
  color: var(--muted);
  font-size: 10px;
}
.toast {
  position: absolute;
  left: 50%;
  top: 91px;
  transform: translate(-50%, -5px);
  opacity: 0;
  transition: opacity .3s, transform .3s;
  width: max-content;
  max-width: 88%;
  padding: 11px 17px;
  border-radius: 24px;
  background: var(--cream);
  color: #273a45;
  text-align: center;
  font-size: 12px;
  pointer-events: none;
}
.toast.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}
.ending {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 60px 20px max(30px, env(safe-area-inset-bottom));
  text-align: center;
  background: linear-gradient(transparent, #111d2aec);
  opacity: 0;
  transition: opacity 1.2s;
  pointer-events: none;
}
.ending.visible { opacity: 1; pointer-events: auto; }
.ending h2 {
  margin: 0 0 9px;
  font-size: clamp(22px, 5vw, 33px);
  font-weight: 500;
  letter-spacing: -1px;
}
.ending p {
  margin: 0 0 22px;
  color: var(--muted);
  font-size: 12px;
}
.ending button {
  border: 1px solid #ffffff25;
  border-radius: 30px;
  padding: 11px 17px;
  margin: 4px;
  background: transparent;
  color: var(--cream);
  cursor: pointer;
  font-size: 12px;
}
.ending button.primary {
  background: var(--mint);
  border-color: var(--mint);
  color: #1d3c34;
}
.stay-controls {
  position: absolute;
  bottom: max(24px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
}
.stay-controls button {
  background: #172735b0;
  border: 1px solid #ffffff25;
  color: var(--cream);
  border-radius: 30px;
  padding: 10px 18px;
  cursor: pointer;
  font-size: 11px;
}
@media (max-width: 600px) {
  header { padding-left: 20px; padding-right: 20px; }
  h1 { font-size: 18px; }
  .action .key { display: none; }
}
</style>
</head>

<body>
<div class="app">
  <canvas id="city" tabindex="0" aria-label="Harbour Days. Walk with arrow keys or WASD. Press E near a place to interact. On a touchscreen, hold in a direction to walk and tap the action button.">
    This game needs a browser with canvas support.
  </canvas>

  <header id="header">
    <div>
      <h1>Harbour Days</h1>
      <div class="subtitle">A small Hong Kong evening.</div>
    </div>
    <button class="sound" id="sound" aria-pressed="false">Sound off</button>
  </header>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="bottom" id="bottom">
    <div class="eyebrow" id="chapter">A little something to eat</div>
    <div class="objective" id="objective" aria-live="polite">
      Pick up warm curry fishballs
    </div>
    <button class="action" id="action" disabled="">
      <span id="actionLabel">Follow the glow</span>
      <span class="key">E</span>
    </button>
    <div class="instructions" id="instructions">
      WASD / arrows to walk · E to interact
    </div>
  </div>

  <section class="ending" id="ending" hidden="" aria-labelledby="endTitle">
    <div class="eyebrow">An evening well spent</div>
    <h2 id="endTitle">Good food. Good company.</h2>
    <p>And quite a view.</p>
    <button class="primary" id="stay">Stay a little longer</button>
    <button id="again">Walk again</button>
  </section>

  <div class="stay-controls" id="stayControls" hidden="">
    <button id="againSmall">Walk again</button>
  </div>
</div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("city");
const ctx = canvas.getContext("2d");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse = matchMedia("(pointer: coarse)").matches;

const C = {
  bg: "#111d2a",
  ground: "#273b4b",
  paving: "#344c5b",
  road: "#1a2c3b",
  mint: "#bcebd8",
  coral: "#ef9588",
  cream: "#f4f0e6",
  gold: "#f2c698",
  muted: "#a9b9c1"
};

const WORLD = { w: 960, h: 1620 };
let W = 0, H = 0, zoom = 1, dpr = 1;
let camera = { x: 0, y: 0 };
let player, cat;
let step = 0;
let time = 0, last = 0;
let pointer = null;
let nearest = null;
let moving = false;
let particles = [];
let photoAt = -100;
let musicAt = -100;
let petAt = -100;
let toastTimer;
let mode = "walk";
let finaleAt = 0;
let endingShown = false;
let soundEnabled = false;
let audio = null;
const keys = new Set();

const tasks = [
  {
    id: "food", x: 333, y: 1240,
    title: "Pick up warm curry fishballs",
    chapter: "A little something to eat"
  },
  {
    id: "tea", x: 627, y: 790,
    title: "Collect two Hong Kong milk teas",
    chapter: "One for you. One for a friend."
  },
  {
    id: "friend", x: 480, y: 265,
    title: "Meet your friend by the harbour",
    chapter: "The best part is sharing"
  }
];

const places = [
  { id: "food", x: 333, y: 1240, label: "Curry fishballs", action: "Pick up fishballs" },
  { id: "cat", x: 376, y: 1128, label: "A friendly local", action: "Pet the cat" },
  { id: "music", x: 593, y: 925, label: "A little street music", action: "Play the chimes" },
  { id: "tea", x: 627, y: 790, label: "Harbour Tea", action: "Collect milk tea" },
  { id: "photo", x: 372, y: 390, label: "A view to remember", action: "Take a photo" },
  { id: "friend", x: 480, y: 265, label: "Your friend", action: "Share the evening" }
];

const buildings = [
  {x:33,y:1265,w:197,h:230,c:C.mint,seed:1},
  {x:736,y:1225,w:187,h:290,c:C.gold,seed:4},
  {x:34,y:810,w:197,h:235,c:C.gold,seed:8},
  {x:736,y:840,w:187,h:205,c:C.mint,seed:2},
  {x:34,y:350,w:197,h:245,c:C.mint,seed:5},
  {x:735,y:365,w:188,h:195,c:C.gold,seed:9}
];

const trees = [
  [284,1400],[676,1370],[284,960],[676,1000],
  [285,485],[674,480],[291,315],[670,315]
];

const traffic = [
  { y:1090, offset:100, speed:81, dir:1 },
  { y:1132, offset:720, speed:72, dir:-1 },
  { y:635, offset:350, speed:84, dir:1 },
  { y:677, offset:870, speed:76, dir:-1 }
];

// ---------- Sound: optional, generated locally ----------

async function enableAudio() {
  const AudioEngine = window.AudioContext || window.webkitAudioContext;
  if (!AudioEngine) {
    notify("Sound is unavailable here. The city still looks lovely.");
    return false;
  }
  try {
    if (!audio) audio = new AudioEngine();
    await audio.resume();
    return audio.state === "running";
  } catch {
    notify("Sound could not start. You can keep playing silently.");
    return false;
  }
}

function note(frequency, delay=0, duration=.65, volume=.07) {
  if (!soundEnabled || !audio || audio.state !== "running") return;

  const at = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();

  osc.type = "sine";
  osc.frequency.value = frequency;

  gain.gain.setValueAtTime(0, at);
  gain.gain.linearRampToValueAtTime(volume, at + .015);
  gain.gain.exponentialRampToValueAtTime(.001, at + duration);

  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start(at);
  osc.stop(at + duration + .05);
}

$("sound").addEventListener("click", async () => {
  if (soundEnabled) {
    soundEnabled = false;
    if (audio) await audio.suspend().catch(() => {});
  } else {
    soundEnabled = await enableAudio();
    if (soundEnabled) note(523.25, 0, .35, .045);
  }
  $("sound").textContent = soundEnabled ? "Sound on" : "Sound off";
  $("sound").setAttribute("aria-pressed", String(soundEnabled));
});

// ---------- Interface ----------

function notify(message) {
  $("toast").textContent = message;
  $("toast").classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("visible"), 3100);
}

function updateObjective() {
  const task = tasks[Math.min(step, 2)];
  $("objective").textContent = task.title;
  $("chapter").textContent = task.chapter;
}

function updateNearby() {
  nearest = null;
  let best = 72;

  for (const place of places) {
    if (place.id === "food" && step > 0) continue;
    if (place.id === "tea" && step > 1) continue;

    const x = place.id === "cat" ? cat.x : place.x;
    const y = place.id === "cat" ? cat.y : place.y;
    const distance = Math.hypot(player.x-x, player.y-y);

    // Let the main errand take priority over a following cat.
    const score = distance + (place.id === "cat" && cat.follow > 0 ? 25 : 0);
    if (score < best) {
      nearest = place;
      best = score;
    }
  }

  $("action").disabled = !nearest || mode !== "walk";
  let label = nearest ? nearest.action : "Follow the glow";

  if (nearest?.id === "tea" && step === 0) label = "Say hello";
  if (nearest?.id === "friend" && step < 2) label = "Say hello";
  if (nearest?.id === "cat" && time-petAt < 2) label = "A happy little cat";

  $("actionLabel").textContent = label;
}

function burst(x,y,color=C.mint,hearts=false) {
  if (reduced) return;
  for(let i=0;i<(hearts?6:15);i++) {
    const a = Math.random()*Math.PI*2;
    const speed = 12+Math.random()*42;
    particles.push({
      x,y,
      vx:Math.cos(a)*speed,
      vy:hearts ? -25-Math.random()*20 : Math.sin(a)*speed-12,
      life:1,
      color,
      hearts
    });
  }
}

function interact() {
  if (mode !== "walk" || !nearest) return;
  const id = nearest.id;

  if (id === "food" && step === 0) {
    step = 1;
    burst(333,1240,C.gold);
    note(523.25);
    note(659.25,.12);
    notify("Warm fishballs, freshly made. Now for the milk tea.");
    updateObjective();
  }

  else if (id === "tea") {
    if (step === 0) {
      notify("Two milk teas? Of course. Pick up your fishballs first.");
    } else if (step === 1) {
      step = 2;
      burst(627,790);
      note(659.25);
      note(783.99,.12);
      notify("Two milk teas, less sweet. Your friend is by the water.");
      updateObjective();
    }
  }

  else if (id === "cat" && time-petAt > 2) {
    petAt = time;
    cat.follow = 11;
    burst(cat.x,cat.y-12,C.coral,true);
    note(880,0,.18,.035);
    note(1046.5,.1,.25,.025);
    notify("You made a local friend.");
  }

  else if (id === "music" && time-musicAt > 2) {
    musicAt = time;
    [523.25,659.25,783.99,1046.5,783.99].forEach((f,i) => {
      note(f,i*.25,.9,.06);
    });
    burst(594,890,C.gold);
    notify(soundEnabled
      ? "A little melody for your evening."
      : "A little light, a little music. Sound is optional.");
  }

  else if (id === "photo" && time-photoAt > 3) {
    photoAt = time;
    note(1318.5,0,.08,.025);
    notify("An evening in Hong Kong. A moment worth keeping.");
  }

  else if (id === "friend") {
    if (step < 2) {
      notify("No rush. I'll save you the best view.");
    } else {
      startFinale();
    }
  }

  if (mode === "walk") updateNearby();
}

$("action").addEventListener("click", interact);

function startFinale() {
  mode = "finale";
  finaleAt = time;
  endingShown = false;
  pointer = null;
  keys.clear();
  $("bottom").hidden = true;
  $("header").style.opacity = "0";
  $("sound").disabled = true;
  clearTimeout(toastTimer);
  $("toast").classList.remove("visible");
  note(523.25,0,1.8,.045);
  note(659.25,.15,1.8,.04);
  note(783.99,.3,2,.035);
}

function showEnding() {
  endingShown = true;
  $("ending").hidden = false;
  requestAnimationFrame(() => $("ending").classList.add("visible"));
  $("stay").focus({preventScroll:true});
}

$("stay").addEventListener("click", () => {
  $("ending").hidden = true;
  $("ending").classList.remove("visible");
  $("stayControls").hidden = false;
  $("againSmall").focus({preventScroll:true});
});

function restart() {
  player = {x:480,y:1460};
  cat = {x:376,y:1128,follow:0};
  step = 0;
  mode = "walk";
  nearest = null;
  moving = false;
  pointer = null;
  keys.clear();
  particles = [];
  photoAt = musicAt = petAt = -100;
  endingShown = false;

  clearTimeout(toastTimer);
  $("toast").classList.remove("visible");
  $("ending").hidden = true;
  $("ending").classList.remove("visible");
  $("stayControls").hidden = true;
  $("bottom").hidden = false;
  $("header").style.opacity = "1";
  $("sound").disabled = false;

  updateObjective();
  updateNearby();
  positionCamera(true);
  canvas.focus({preventScroll:true});
}
$("again").addEventListener("click",restart);
$("againSmall").addEventListener("click",restart);

// ---------- Controls ----------

const movementKeys = ["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"];

window.addEventListener("keydown", e => {
  if (mode !== "walk") return;
  const key = e.key.toLowerCase();

  if (movementKeys.includes(key)) {
    e.preventDefault();
    keys.add(key);
  }
  if (key === "e" && !e.repeat) {
    e.preventDefault();
    interact();
  }
});
window.addEventListener("keyup",e => keys.delete(e.key.toLowerCase()));
window.addEventListener("blur",() => {
  keys.clear();
  pointer = null;
});

function setPointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer = {x:e.clientX-r.left,y:e.clientY-r.top};
}
canvas.addEventListener("pointerdown",e => {
  if (mode !== "walk") return;
  canvas.setPointerCapture(e.pointerId);
  setPointer(e);
});
canvas.addEventListener("pointermove",e => {
  if (pointer) setPointer(e);
});
["pointerup","pointercancel","lostpointercapture"].forEach(event => {
  canvas.addEventListener(event,() => pointer=null);
});

if (coarse) {
  $("instructions").textContent = "Hold in a direction to walk · Tap the button to interact";
} else {
  $("instructions").textContent = "WASD / arrows or hold mouse to walk · E to interact";
}

document.addEventListener("visibilitychange",() => {
  keys.clear();
  pointer = null;
  last = 0;
});

// ---------- Camera ----------

function resize() {
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  dpr = Math.min(devicePixelRatio || 1,2);
  canvas.width = Math.round(W*dpr);
  canvas.height = Math.round(H*dpr);
  zoom = Math.min(1.12,W/740,H/800);
  if (player) positionCamera(true);
}

function positionCamera(snap=false,dt=.016) {
  const viewW=W/zoom, viewH=H/zoom;
  const x=(WORLD.w-viewW)/2;
  const y=Math.max(0,Math.min(
    Math.max(0,WORLD.h-viewH),
    player.y-viewH*.55
  ));
  const amount=snap || reduced ? 1 : 1-Math.exp(-9*dt);
  camera.x+=(x-camera.x)*amount;
  camera.y+=(y-camera.y)*amount;
}

window.addEventListener("resize",resize);

// ---------- Drawing helpers ----------

function rect(x,y,w,h,color) {
  ctx.fillStyle=color;
  ctx.fillRect(x,y,w,h);
}
function circle(x,y,r,color) {
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=color;
  ctx.fill();
}
function ellipse(x,y,rx,ry,color) {
  ctx.beginPath();
  ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle=color;
  ctx.fill();
}
function line(x1,y1,x2,y2,color,width=1) {
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.stroke();
}
function text(value,x,y,size,color,weight=500) {
  ctx.textAlign="center";
  ctx.fillStyle=color;
  ctx.font=`${weight} ${size}px system-ui, sans-serif`;
  ctx.fillText(value,x,y);
}
function light(x,y,r,color) {
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color);
  g.addColorStop(1,"transparent");
  rect(x-r,y-r,r*2,r*2,g);
}
function person(x,y,color,walk=false,bag=false,bow=0) {
  ellipse(x,y+10,10,4,"#101c2945");
  const stride=walk&&!reduced ? Math.sin(time*13)*3 : 0;

  line(x-4,y+1,x-5,y+12+stride,"#172a39",4);
  line(x+4,y+1,x+5,y+12-stride,"#172a39",4);
  rect(x-7,y-13,14,18,color);
  circle(x+bow,y-19+Math.abs(bow)*.4,6,"#ddb294");
  rect(x-6+bow,y-25+Math.abs(bow)*.4,12,5,"#27313b");

  if (bag) {
    rect(x+8,y-4,8,11,C.gold);
    line(x+9,y-4,x+14,y-7,C.cream,1);
    if(step>=2) {
      rect(x-14,y-4,6,10,C.gold);
      rect(x-15,y-6,8,3,C.cream);
    }
  }
}

// ---------- City artwork ----------

function building(b) {
  rect(b.x+12,b.y+12,b.w,b.h,"#10203030");
  rect(b.x,b.y,b.w,b.h,"#1d3041");
  rect(b.x+9,b.y+8,b.w-18,18,"#3c5061");
  rect(b.x+b.w-16,b.y,16,b.h,"#172b3a");

  for(let row=0;row<Math.floor((b.h-45)/27);row++) {
    for(let col=0;col<5;col++) {
      const lit=(row*7+col*3+b.seed)%5!==0;
      rect(b.x+22+col*29,b.y+41+row*27,9,13,
        lit ? b.c+"90" : "#344856");
    }
  }

  rect(b.x,b.y+25,2,b.h-25,b.c+"70");
  rect(b.x+15,b.y-7,43,7,"#455b6c");
  line(b.x+b.w-32,b.y,b.x+b.w-32,b.y-24,"#71828e",2);
  circle(b.x+b.w-32,b.y-26,2,C.coral);
}

function tree(x,y) {
  ellipse(x+5,y+8,21,10,"#14253530");
  rect(x-2,y-7,4,18,"#8d8176");
  circle(x,y-16,18,"#41685f");
  circle(x-6,y-22,12,"#4f7c6e");
  circle(x+9,y-17,11,"#466f64");
}

function lamp(x,y) {
  light(x,y,65,"#f2c69814");
  line(x,y,x,y-26,"#8498a3",2);
  circle(x,y-28,4,C.gold);
  light(x,y-28,20,"#f2c69828");
}

function shop(x,y,label,color,food) {
  light(x,y+25,100,color+"13");
  rect(x-65,y-32,130,70,"#1c3040");
  rect(x-57,y-25,114,48,"#536366");
  rect(x-49,y-16,98,32,"#f2c69845");
  rect(x-2,y-16,4,32,"#3b515e");
  rect(x-69,y-44,138,21,color);
  text(label,x,y-29,9,"#213c42",700);
  rect(x-69,y+23,138,10,"#657474");
  rect(x-63,y+33,126,7,"#172b39");

  if(food) {
    ellipse(x-24,y+15,13,5,"#bbc1b7");
    for(let i=0;i<3;i++) {
      line(x+10+i*11,y+16,x+10+i*11,y-2,C.cream);
      circle(x+10+i*11,y+4,3,C.gold);
      circle(x+10+i*11,y+10,3,C.gold);
    }
    if(!reduced) {
      for(let i=0;i<3;i++) {
        const p=(time*.45+i/3)%1;
        ctx.save();
        ctx.globalAlpha=(1-p)*.3;
        circle(x-24+Math.sin(p*6+i)*4,y-2-p*24,2+p*2,C.cream);
        ctx.restore();
      }
    }
  } else {
    for(let i=0;i<3;i++) {
      rect(x-21+i*18,y+4,10,13,C.gold);
      rect(x-22+i*18,y+2,12,3,C.cream);
    }
  }
}

function drawCat() {
  const bounce=cat.follow>0&&!reduced ? Math.sin(time*12)*1.5 : 0;
  const y=cat.y+bounce;
  ellipse(cat.x,y+7,11,4,"#17253440");

  ctx.save();
  ctx.strokeStyle=C.gold;
  ctx.lineWidth=4;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(cat.x-8,y);
  ctx.quadraticCurveTo(cat.x-21,y-4,cat.x-15,y-12);
  ctx.stroke();
  ctx.restore();

  ellipse(cat.x,y,10,6,C.gold);
  circle(cat.x+7,y-6,6,C.gold);

  ctx.beginPath();
  ctx.moveTo(cat.x+2,y-10);
  ctx.lineTo(cat.x+3,y-16);
  ctx.lineTo(cat.x+7,y-11);
  ctx.moveTo(cat.x+8,y-11);
  ctx.lineTo(cat.x+12,y-15);
  ctx.lineTo(cat.x+12,y-8);
  ctx.fillStyle=C.gold;
  ctx.fill();

  circle(cat.x+8,y-6,1,"#4d4238");

  if(time-petAt<1.5) {
    text("♥",cat.x,y-26,14,C.coral);
  }
}

function musician() {
  const active=time-musicAt<2;
  const bow=active&&!reduced ? Math.sin((time-musicAt)*Math.PI/2)*4 : 0;
  person(627,917,C.coral,false,false,bow);

  line(565,898,613,898,"#95a7ad",2);
  line(565,898,565,937,"#95a7ad",2);
  line(613,898,613,937,"#95a7ad",2);

  for(let i=0;i<3;i++) {
    const lit=active&&(Math.floor((time-musicAt)/.25)%3===i);
    const x=578+i*12;
    line(x,899,x,911,"#c9c5af");
    if(lit) light(x,917,22,"#bcebd833");
    rect(x-3,911,6,14+i*4,lit ? C.mint : "#a8c2b4");
  }
  if(active) text("♪",641,889,17,C.mint);
}

function cameraStand() {
  line(373,368,361,391,"#8fa2aa",2);
  line(373,368,384,391,"#8fa2aa",2);
  rect(360,354,26,17,"#253d4e");
  rect(364,350,8,5,"#91a5ad");
  circle(374,362,6,C.mint);
  circle(374,362,3,"#294958");
}

function taxi(car) {
  const travel=(car.offset+time*car.speed)%1160;
  const x=car.dir===1 ? travel-100 : 1060-travel;
  ctx.save();
  ctx.translate(x,car.y);
  if(car.dir===-1) ctx.rotate(Math.PI);

  ellipse(0,5,31,13,"#00000020");
  rect(-29,-12,58,24,"#d67d73");
  rect(-9,-11,28,22,"#e7e4d9");
  rect(-7,-9,9,18,"#354f60");
  rect(10,-9,7,18,"#354f60");
  rect(3,-5,6,10,C.gold);
  rect(-20,-15,12,3,"#11222f");
  rect(13,-15,10,3,"#11222f");
  rect(-20,12,12,3,"#11222f");
  rect(13,12,10,3,"#11222f");
  rect(27,-9,3,5,C.cream);
  rect(27,4,3,5,C.cream);
  light(39,0,25,"#f2c69818");
  ctx.restore();
}

function harbour() {
  rect(0,0,960,198,"#18394b");

  for(let i=0;i<27;i++) {
    const h=28+(i*37)%77;
    const x=i*38-20;
    rect(x,103-h,29,h,"#2c4c5c");
    for(let y=111-h;y<97;y+=12) {
      rect(x+7,y,3,4,"#f2c69870");
      rect(x+18,y,3,4,"#bcebd855");
    }
  }

  for(let i=0;i<38;i++) {
    const sway=reduced ? 0 : Math.sin(time*.7+i)*4;
    rect((i*83)%960+sway,124+(i*17)%60,12+i%4*8,1,"#bcebd82b");
  }

  rect(0,198,960,8,"#768b93");
  line(0,186,960,186,"#adbbb9",2);
  for(let x=0;x<960;x+=45) rect(x,185,2,22,"#adbbb9");

  text("VICTORIA HARBOUR",480,149,10,"#bed0cc");
  rect(519,246,66,9,"#999c8e");
  rect(524,255,4,10,"#617985");
  rect(576,255,4,10,"#617985");
  person(503,251,C.coral);
}

function markers() {
  const target=tasks[step];

  for(const place of places) {
    if(place.id===target.id) continue;
    if(place.id==="food"&&step>0) continue;
    if(place.id==="tea"&&step>1) continue;
    if(place.id==="friend") continue;

    const x=place.id==="cat"?cat.x:place.x;
    const y=place.id==="cat"?cat.y:place.y;
    const near=Math.hypot(player.x-x,player.y-y)<165;

    if(near) {
      circle(x,y-45,2.5,C.cream);
      if(nearest?.id===place.id) {
        text(place.label,x,y-58,10,C.cream);
      }
    }
  }

  const pulse=reduced?0:Math.sin(time*2.5)*2;
  light(target.x,target.y,65,"#bcebd81c");
  ctx.strokeStyle=C.mint;
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.ellipse(target.x,target.y,25+pulse,12+pulse*.4,0,0,Math.PI*2);
  ctx.stroke();

  circle(target.x,target.y-27,3,C.mint);
  if(nearest?.id===target.id) {
    text(places.find(p=>p.id===target.id).label,
      target.x,target.y-43,10,C.mint);
  }
}

function drawWorld() {
  rect(-3000,-2000,7000,6000,C.ground);
  rect(255,206,450,1414,C.paving);
  rect(255,206,3,1414,"#8da5ad35");
  rect(702,206,3,1414,"#8da5ad35");

  for(let y=285;y<1620;y+=69) {
    line(260,y,700,y,"#becbc710");
  }
  for(let y=310;y<1530;y+=110) {
    rect(479,y,2,17,"#bcebd81a");
  }

  for(const y of [1060,605]) {
    rect(0,y,960,105,C.road);
    line(0,y+2,960,y+2,"#84928f55");
    line(0,y+103,960,y+103,"#84928f55");
    for(let x=0;x<960;x+=70) {
      rect(x,y+51,25,2,"#cbb89a50");
    }
    for(let i=0;i<7;i++) {
      rect(403,y+9+i*13,155,6,"#d2d9cd45");
    }
  }

  buildings.forEach(building);
  trees.forEach(([x,y])=>tree(x,y));

  [[275,1305],[685,1270],[275,830],[684,855],[275,425],[684,405]]
    .forEach(([x,y])=>lamp(x,y));

  shop(333,1180,"CURRY FISHBALLS",C.gold,true);
  shop(627,730,"HARBOUR TEA",C.mint,false);

  rect(307,1380,39,8,"#93a095");
  rect(310,1388,3,8,"#617782");
  rect(340,1388,3,8,"#617782");

  traffic.forEach(taxi);
  musician();
  cameraStand();
  harbour();
  markers();
  drawCat();
  person(player.x,player.y,C.cream,moving,step>0);

  for(const p of particles) {
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.hearts) text("♥",p.x,p.y,11,p.color);
    else circle(p.x,p.y,2,p.color);
    ctx.restore();
  }
}

// ---------- Direction hint and postcard ----------

function drawDirection() {
  const target=tasks[step];
  const tx=(target.x-camera.x)*zoom;
  const ty=(target.y-camera.y)*zoom;

  if(tx>35&&tx<W-35&&ty>130&&ty<H-190) return;

  const px=(player.x-camera.x)*zoom;
  const py=(player.y-camera.y)*zoom;
  const a=Math.atan2(target.y-player.y,target.x-player.x);
  const x=px+Math.cos(a)*68;
  const y=py+Math.sin(a)*68;

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(a);
  ctx.strokeStyle=C.mint;
  ctx.lineWidth=2;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(-5,-5);
  ctx.lineTo(1,0);
  ctx.lineTo(-5,5);
  ctx.stroke();
  ctx.restore();
}

function drawPostcard() {
  const age=time-photoAt;
  if(age<0||age>3.1) return;

  const alpha=Math.min(1,age/.25,(3.1-age)/.4);
  const w=Math.min(W-48,350);
  const h=w*.72;
  const x=(W-w)/2;
  const y=Math.max(130,(H-h)/2-35);

  ctx.save();
  ctx.globalAlpha=Math.max(0,alpha);
  rect(0,0,W,H,"#111d2840");
  ctx.shadowColor="#00000040";
  ctx.shadowBlur=30;
  rect(x,y,w,h,C.cream);
  ctx.shadowBlur=0;

  rect(x+12,y+12,w-24,h-60,"#203e51");
  const base=y+h-82;

  for(let i=0;i<13;i++) {
    const bw=(w-32)/13;
    const bh=20+(i*23)%Math.max(25,Math.floor(h*.3));
    const bx=x+16+i*bw;
    rect(bx,base-bh,bw-3,bh,"#547080");
    rect(bx+5,base-bh+9,3,8,C.gold);
  }

  line(x+12,base+2,x+w-12,base+2,"#bcebd860");
  text("An evening in Hong Kong.",W/2,y+h-25,12,"#38505b");

  ctx.restore();
}

// ---------- Fireworks finale ----------

function fireworkBurst(index,age,reflection=false) {
  const period=9;
  const offset=index*1.75;
  const local=(age-offset)%period;

  if(age<offset||local<0||local>3.5) return;

  const colors=[C.coral,C.mint,C.gold];
  const color=colors[index%3];
  const cx=W*[.25,.70,.46,.81,.17][index%5];
  const cy=H*[.25,.18,.32,.29,.16][index%5];
  const maxRadius=Math.min(W,H)*[.12,.14,.115,.095,.09][index%5];

  ctx.save();

  if(reflection) {
    const waterline=H*.54;
    ctx.translate(0,waterline*1.36);
    ctx.scale(1,-.36);
    ctx.globalAlpha=.14;
  }

  if(local<.65) {
    if(!reflection) {
      const progress=local/.65;
      const y=H*.52+(cy-H*.52)*progress;
      line(cx,y+17,cx,y,color,1.3);
      circle(cx,y,2,C.cream);
    }
    ctx.restore();
    return;
  }

  const t=(local-.65)/2.85;
  const radius=maxRadius*(1-Math.pow(1-t,3));
  const opacity=Math.pow(1-t,1.15);
  ctx.globalAlpha*=opacity;

  for(let i=0;i<38;i++) {
    const a=i/38*Math.PI*2+index*.7;
    const variation=.77+((i*17)%11)/45;
    const r=radius*variation;
    const fall=t*t*35;

    const x=cx+Math.cos(a)*r;
    const y=cy+Math.sin(a)*r+fall;
    const tail=5+8*(1-t);

    line(
      x-Math.cos(a)*tail,
      y-Math.sin(a)*tail,
      x,y,color,1.5
    );
    circle(x,y,1.6,color);
  }
  ctx.restore();
}

function drawFinale() {
  const age=time-finaleAt;
  const reveal=reduced?1:Math.min(1,age/1.1);

  ctx.save();
  ctx.globalAlpha=reveal;

  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#111d2a");
  sky.addColorStop(.54,"#294656");
  sky.addColorStop(1,"#172e3d");
  rect(0,0,W,H,sky);

  const skyline=H*.53;
  const waterline=H*.54;

  // Quiet stars.
  for(let i=0;i<33;i++) {
    const x=((i*137+31)%997)/997*W;
    const y=((i*71+17)%337)/337*H*.4;
    circle(x,y,i%4===0?1.1:.65,"#f4f0e645");
  }

  if(reduced) {
    // Static celebratory lights instead of moving bursts.
    [[.22,.22],[.72,.18],[.48,.29]].forEach(([x,y],i)=>{
      const color=[C.coral,C.mint,C.gold][i];
      light(W*x,H*y,Math.min(W,H)*.12,color+"24");
      for(let j=0;j<16;j++) {
        const a=j/16*Math.PI*2;
        const r=Math.min(W,H)*.07;
        circle(W*x+Math.cos(a)*r,H*y+Math.sin(a)*r,2,color);
      }
    });
  } else {
    for(let i=0;i<5;i++) fireworkBurst(i,age);
  }

  // A broader skyline fills the cinematic view.
  const count=26;
  const bw=W/count;

  for(let i=0;i<count;i++) {
    const bh=H*(.045+((i*37)%83)/830);
    const x=i*bw;
    rect(x,skyline-bh,bw-3,bh,"#203644");

    if(i%5===0) {
      line(x+bw*.5,skyline-bh,x+bw*.5,skyline-bh-18,"#647e88",1);
    }

    for(let row=0;row<Math.floor(bh/12)-1;row++) {
      for(let col=0;col<2;col++) {
        if((row+col+i)%4===0) continue;
        rect(x+5+col*bw*.4,skyline-bh+9+row*12,2,4,
          (i+row)%3===0?"#bcebd88a":"#f2c6989a");
      }
    }
  }

  rect(0,waterline,W,H*.29,"#173647");

  if(!reduced) {
    for(let i=0;i<5;i++) fireworkBurst(i,age,true);
  }

  for(let i=0;i<75;i++) {
    const x=((i*97)%997)/997*W;
    const y=waterline+9+((i*43)%211)/211*H*.24;
    const drift=reduced?0:Math.sin(time*.65+i)*4;
    rect(x+drift,y,7+i%5*6,1,i%3===0?"#f2c69830":"#bcebd821");
  }

  // Waterfront foreground.
  const promenade=H*.79;
  rect(0,promenade,W,H-promenade,"#203442");
  line(0,promenade-17,W,promenade-17,"#a9b9b680",2);
  for(let x=15;x<W;x+=64) {
    line(x,promenade-17,x,promenade+7,"#9aaead",2);
  }

  // Two people, their takeaway, and perhaps a local friend.
  ctx.save();
  const peopleScale=Math.min(1.7,Math.max(1.1,W/500));
  ctx.translate(W*.5,promenade+12);
  ctx.scale(peopleScale,peopleScale);

  rect(-43,-3,87,7,"#8d978c");
  rect(-37,4,4,14,"#576e77");
  rect(32,4,4,14,"#576e77");
  person(-18,-5,C.cream);
  person(18,-5,C.coral);

  rect(-4,-1,8,8,C.gold);
  rect(-6,-3,12,2,C.cream);
  rect(30,-4,5,8,C.gold);

  if(petAt>-50) {
    ellipse(-61,6,9,5,C.gold);
    circle(-55,1,5,C.gold);
  }
  ctx.restore();

  if(age<7) {
    const alpha=Math.min(1,age/2);
    ctx.save();
    ctx.globalAlpha*=alpha;
    text("Just in time.",W/2,H*.90,15,C.cream);
    ctx.restore();
  }

  ctx.restore();
}

// ---------- Simulation ----------

function update(dt) {
  time+=dt;

  if(mode==="finale") {
    if(!endingShown&&time-finaleAt>8) showEnding();
    return;
  }

  let dx=Number(keys.has("d")||keys.has("arrowright"))-
         Number(keys.has("a")||keys.has("arrowleft"));
  let dy=Number(keys.has("s")||keys.has("arrowdown"))-
         Number(keys.has("w")||keys.has("arrowup"));

  if(pointer) {
    dx=pointer.x/zoom+camera.x-player.x;
    dy=pointer.y/zoom+camera.y-player.y;
    if(Math.hypot(dx,dy)<12) dx=dy=0;
  }

  const length=Math.hypot(dx,dy);
  moving=length>0;

  if(length) {
    const distance=Math.min(145*dt,pointer?length:Infinity);
    player.x+=dx/length*distance;
    player.y+=dy/length*distance;
    player.x=Math.max(276,Math.min(684,player.x));
    player.y=Math.max(224,Math.min(1515,player.y));
  }

  // The street is forgiving: traffic is decorative.
  // Small shop footprints keep the player out of the counters.
  const counters=[
    {x:264,y:1136,w:138,h:84},
    {x:558,y:686,w:138,h:84}
  ];
  for(const b of counters) {
    const pad=10;
    if(player.x>b.x-pad&&player.x<b.x+b.w+pad&&
       player.y>b.y-pad&&player.y<b.y+b.h+pad) {
      const distances=[
        Math.abs(player.x-(b.x-pad)),
        Math.abs(player.x-(b.x+b.w+pad)),
        Math.abs(player.y-(b.y-pad)),
        Math.abs(player.y-(b.y+b.h+pad))
      ];
      const edge=distances.indexOf(Math.min(...distances));
      if(edge===0) player.x=b.x-pad;
      if(edge===1) player.x=b.x+b.w+pad;
      if(edge===2) player.y=b.y-pad;
      if(edge===3) player.y=b.y+b.h+pad;
    }
  }

  if(cat.follow>0) {
    cat.follow=Math.max(0,cat.follow-dt);
    const dx=player.x-24-cat.x;
    const dy=player.y+23-cat.y;
    const distance=Math.hypot(dx,dy);
    if(distance>8) {
      const amount=Math.min(distance,160*dt);
      cat.x+=dx/distance*amount;
      cat.y+=dy/distance*amount;
    }
  }

  particles=particles.filter(p=>p.life>0);
  for(const p of particles) {
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.life-=dt*.7;
  }

  updateNearby();
  positionCamera(false,dt);
}

function render() {
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  if(mode==="walk" || time-finaleAt<1.1) {
    ctx.save();
    ctx.scale(zoom,zoom);
    ctx.translate(-camera.x,-camera.y);
    drawWorld();
    ctx.restore();
  }

  if(mode==="walk") {
    drawDirection();
    drawPostcard();
  } else {
    drawFinale();
  }
}

function frame(timestamp) {
  const dt=last?Math.min((timestamp-last)/1000,.04):0;
  last=timestamp;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

resize();
restart();
requestAnimationFrame(frame);

})();
</script>
